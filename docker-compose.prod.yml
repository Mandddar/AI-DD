# Production overrides — run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    volumes: []   # no bind mount in production
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      ENVIRONMENT: production

  celery-worker:
    volumes: []
    command: uv run celery -A celery_app worker --loglevel=warning --concurrency=4
    environment:
      ENVIRONMENT: production

  web:
    build:
      target: production    # use the nginx production stage
    ports:
      - "80:80"
    volumes: []             # no bind mount — serve built assets from image
